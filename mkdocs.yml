# Project information
site_name: Inteligencia Artificial y Estrategia Empresarial
site_author: Sebastian Azocar
site_description: ICS64225 - Inteligencia Artificial y Estrategia Empresarial (USM)
site_url: https://hizocar.github.io/ia-course-usm/

# Markdown extensions
markdown_extensions:
  - attr_list
  - admonition
  - pymdownx.details
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist
  - pymdownx.tabbed

# Theme
theme:
  name: material
  language: es
  logo: images/usm_shield.png
  favicon: images/usm_favicon.png
  features:
    - navigation.instant
    - navigation.top
    - navigation.tabs
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    # Light mode
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Extra JavaScript (gráficos interactivos)
extra_javascript:
  - https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js
  - javascripts/charts.js

# Customization
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hizocar

# Plugins
plugins:
  - search

